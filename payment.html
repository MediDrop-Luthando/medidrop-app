<!DOCTYPE html>
<html>
<head>
  <title>Medi-Drop Payment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Payment</h1>
  <form onsubmit="handlePaymentSubmit(); return false;">
    <label for="card">Card Number:</label><br>
    <input type="text" id="card" name="card"><br>
    <label for="expiry">Expiry Date:</label><br>
    <input type="text" id="expiry" name="expiry"><br>
    <label for="cvv">CVV:</label><br>
    <input type="text" id="cvv" name="cvv"><br><br>

    <label for="payshap">PayShap:</label>
    <input type="radio" id="payshap" name="payment_method" value="payshap"><br>

    <label for="eft">EFT (Bank Transfer):</label>
    <input type="radio" id="eft" name="payment_method" value="eft"><br><br>

    <input type="submit" value="Submit">
  </form>
  <script src="script.js"></script>
</body>
</html>
